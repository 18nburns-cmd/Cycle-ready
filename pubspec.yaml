name: cycle_ready
description: A cycling-focused readiness, recovery, and health dashboard.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  health: ^13.3.1
  file_selector: ^1.1.0
  fit_sdk: ^0.3.0
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  flutter_blue_plus: ^2.3.11
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.16.0
  llama_flutter_android: 0.2.6
  share_plus: ^12.0.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  image: ^4.5.4
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/strength/
    - assets/mobility/
