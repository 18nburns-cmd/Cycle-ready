name: Android upgrade data-preservation smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Provision Firebase application configuration
        env:
          FIREBASE_JSON_BASE64: ${{ secrets.CYCLEREADY_FIREBASE_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_JSON_BASE64"
          echo "$FIREBASE_JSON_BASE64" | base64 --decode > android/app/google-services.json
      - run: flutter pub get
      - name: Generate Drift database sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Reinstall candidate and verify retained data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            flutter test integration_test/android_upgrade_data_preservation_test.dart -d emulator-5554 --dart-define=CYCLEREADY_UPGRADE_SMOKE_PHASE=seed
            flutter test integration_test/android_upgrade_data_preservation_test.dart -d emulator-5554 --dart-define=CYCLEREADY_UPGRADE_SMOKE_PHASE=verify
