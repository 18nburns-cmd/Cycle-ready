name: Deploy CycleReady Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate cloud configuration
        env:
          SUPABASE_URL: ${{ vars.CYCLEREADY_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.CYCLEREADY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing repository variable: CYCLEREADY_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing repository secret: CYCLEREADY_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Build web dashboard
        env:
          SUPABASE_URL: ${{ vars.CYCLEREADY_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.CYCLEREADY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p config
          printf '{"CYCLEREADY_SUPABASE_URL":"%s","CYCLEREADY_SUPABASE_PUBLISHABLE_KEY":"%s"}' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > config/cloud_defines.ci.json
          flutter build web --release \
            --target lib/main_web.dart \
            --base-href /Cycle-ready/ \
            --dart-define-from-file=config/cloud_defines.ci.json
          if ! grep -Fq "$SUPABASE_URL" build/web/main.dart.js; then
            echo "Compiled web bundle does not contain the configured Supabase URL"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
