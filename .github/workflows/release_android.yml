name: Release private Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Provision private build files
        env:
          KEYSTORE_BASE64: ${{ secrets.CYCLEREADY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CYCLEREADY_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYCLEREADY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYCLEREADY_ANDROID_KEY_PASSWORD }}
          FIREBASE_JSON_BASE64: ${{ secrets.CYCLEREADY_FIREBASE_JSON_BASE64 }}
          SUPABASE_URL: ${{ vars.CYCLEREADY_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.CYCLEREADY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          test -n "$FIREBASE_JSON_BASE64" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/cycleready-release.jks
          echo "$FIREBASE_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf 'storeFile=cycleready-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          mkdir -p config
          printf '{"CYCLEREADY_SUPABASE_URL":"%s","CYCLEREADY_SUPABASE_PUBLISHABLE_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_KEY" > config/cloud_defines.ci.json
      - run: flutter pub get
      - name: Generate Drift database sources
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter analyze
      - name: Build signed APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=config/cloud_defines.ci.json
      - name: Verify release artifact privacy
        env:
          CYCLEREADY_PRIVATE_SCAN_VALUES: ${{ secrets.CYCLEREADY_PRIVATE_SCAN_VALUES }}
        run: |
          mkdir -p build/privacy-apk
          unzip -q build/app/outputs/flutter-apk/app-release.apk -d build/privacy-apk
          dart run tool/verify_release_privacy.dart build/privacy-apk
      - name: Name and checksum artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CycleReady-${GITHUB_REF_NAME}.apk
          sha256sum CycleReady-${GITHUB_REF_NAME}.apk > CycleReady-${GITHUB_REF_NAME}.apk.sha256
      - name: Publish private release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CycleReady-${{ github.ref_name }}.apk
            CycleReady-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
